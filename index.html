<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boxing Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#140720;--ink-2:#1c0d2e;--panel:#231338;--panel-2:#2c1945;
    --line:rgba(255,255,255,.08);--line-strong:rgba(255,255,255,.16);
    --magenta:#ff2e7e;--gold:#ffc94d;--mint:#48e6c2;
    --text:#f4ecfa;--muted:#a58ebe;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:
      radial-gradient(1200px 600px at 82% -10%, rgba(255,46,126,.15), transparent 60%),
      radial-gradient(900px 500px at 0% 0%, rgba(72,230,194,.09), transparent 55%),
      var(--ink);
    color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.5;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:0 24px}
  .disp{font-family:'Archivo',sans-serif;font-weight:900;letter-spacing:-.02em;line-height:.95}
  .eyebrow{font-family:'Archivo',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.22em;font-size:11px;color:var(--muted)}

  header{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);
    background:linear-gradient(var(--ink),rgba(20,7,32,.55));border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;justify-content:space-between;height:62px}
  .brand{display:flex;align-items:center;gap:11px;font-family:'Archivo',sans-serif;font-weight:800;font-size:15px}
  .bar .dot{width:12px;height:12px;border-radius:3px;background:var(--magenta);box-shadow:0 0 16px var(--magenta)}

  .hero{padding:56px 0 24px}
  .hero .eyebrow{margin-bottom:16px}
  .hero h1{font-size:clamp(38px,8vw,80px);text-transform:uppercase}

  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 32px}
  .tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:100px;
    padding:9px 20px;font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;cursor:pointer;transition:all .2s}
  .tab:hover{color:var(--text);border-color:var(--line-strong)}
  .tab.active{background:var(--magenta);border-color:var(--magenta);color:#fff}

  .panel{padding-bottom:40px}
  .subhead{font-family:'Archivo',sans-serif;font-weight:800;font-size:14px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--muted);margin:0 0 14px}
  .head h2{font-size:clamp(22px,4vw,32px);text-transform:uppercase;margin-bottom:20px}
  section.block{margin-bottom:36px}

  .tablewrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;overflow-x:auto;margin-bottom:8px}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:480px}
  thead th{background:var(--ink-2);text-align:left;padding:12px;font-family:'Archivo',sans-serif;
    font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
  tbody td{padding:12px;border-top:1px solid var(--line);white-space:nowrap}
  tbody tr:hover{background:rgba(255,255,255,.03)}
  .vs{color:var(--muted);margin:0 8px}
  .tag{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
    color:var(--mint);border:1px solid rgba(72,230,194,.35);border-radius:100px;padding:2px 9px}
  .tag.number{color:var(--gold);border-color:rgba(255,201,77,.35)}
  .tag.squad{color:var(--magenta);border-color:rgba(255,46,126,.35)}

  .rec{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:20px;margin-bottom:16px}
  .rec .cap{font-family:'Archivo',sans-serif;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .rec .who{font-family:'Archivo',sans-serif;font-weight:900;font-size:22px;margin:8px 0 3px}
  .rec .det{font-size:13.5px;color:var(--muted)}

  a.btn{display:inline-block;background:var(--magenta);color:#fff;border-radius:10px;padding:11px 20px;
    font-family:'Archivo',sans-serif;font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;
    text-decoration:none;margin-top:10px}
  a.btn:hover{opacity:.88}
  a.btn.secondary{background:var(--panel-2);border:1px solid var(--line-strong)}

  input[type=text]{width:100%;max-width:340px;background:var(--panel);color:var(--text);
    border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;font-size:14px}

  footer{border-top:1px solid var(--line);margin-top:20px;padding:24px 0 50px;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <div class="brand"><span class="dot"></span> BOXING DAY</div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow" id="yearLabel">Loading…</div>
    <h1 class="disp">Boxing Day</h1>
  </section>

  <div class="tabs" id="tabBar">
    <button class="tab active" data-tab="rules">Rules</button>
    <button class="tab" data-tab="overview">Overview</button>
    <button class="tab" data-tab="leaderboard">Leaderboard</button>
    <button class="tab" data-tab="edit">Edit form</button>
  </div>

  <div class="panel" id="panel-rules"></div>
  <div class="panel" id="panel-overview" style="display:none"></div>
  <div class="panel" id="panel-leaderboard" style="display:none"></div>
  <div class="panel" id="panel-edit" style="display:none"></div>
</main>

<footer><div class="wrap">Boxing Day · loaded from <b>data/matches.csv</b> + <b>data/categories.csv</b> + <b>data/eligible-players.csv</b> + <b>data/submissions.csv</b> + <b>data/results.csv</b> + <b>data/player-points.csv</b></div></footer>

<script>
"use strict";
function parseCSV(txt){
  const lines=txt.trim().split(/\r?\n/);
  if(!lines[0])return[];
  const head=lines[0].split(",");
  return lines.slice(1).filter(l=>l.length).map(l=>{
    const c=[];let cur="",inQ=false;
    for(let i=0;i<l.length;i++){const ch=l[i];
      if(ch==='"'){inQ=!inQ;}
      else if(ch===","&&!inQ){c.push(cur);cur="";}
      else cur+=ch;
    }
    c.push(cur);
    const o={};head.forEach((h,i)=>o[h]=c[i]!==undefined?c[i]:"");return o;
  });
}
async function loadCSV(path){
  const res=await fetch(path);
  if(!res.ok)throw new Error(`Failed to load ${path} (HTTP ${res.status})`);
  return parseCSV(await res.text());
}
async function loadCSVSoft(path){
  try{return await loadCSV(path);}
  catch(err){console.warn(`${path} not available yet:`,err.message);return[];}
}
const TYPE_LABEL={match_score:"score",number:"number",team_pick:"team",match_pick:"match",player_pick:"player",fpl_squad:"squad"};
const GH_REPO="Scorelax/boxing-day";

(async function(){
  let matches,categories;
  try{
    [matches,categories]=await Promise.all([loadCSV("data/matches.csv"),loadCSV("data/categories.csv")]);
  }catch(err){
    document.querySelector("main").innerHTML=`<div class="rec" style="margin:60px 0"><div class="cap">Couldn't load data</div><div class="det">${err.message}<br><br>If you opened this file directly from disk, run a local server instead — e.g. <code>python -m http.server</code> — then open the printed http://localhost address.</div></div>`;
    return;
  }
  const [players,submissions,results,playerPoints]=await Promise.all([
    loadCSVSoft("data/eligible-players.csv"),loadCSVSoft("data/submissions.csv"),
    loadCSVSoft("data/results.csv"),loadCSVSoft("data/player-points.csv"),
  ]);

  const year=matches[0]?.season||new Date().getUTCFullYear();
  document.getElementById("yearLabel").textContent=matches.length
    ?`Boxing Day ${year} · ${matches.length} matches`
    :`Boxing Day ${year}`;

  // ---------- tab: Rules ----------
  const fixturesHTML=!matches.length
    ? `<div class="rec"><div class="cap">Fixtures not confirmed yet</div><div class="det">The Premier League only finalizes Boxing Day kickoff times/pairings shortly before the day. A scheduled job pulls the real fixtures (and the eligible-player pool for the squad bet) automatically on December 25th.</div></div>`
    : `<div class="tablewrap"><table>
        <thead><tr><th>Kickoff</th><th>Home</th><th></th><th>Away</th></tr></thead>
        <tbody>${matches.map(m=>{
          const d=new Date(m.kickoff);
          const when=isNaN(d)?m.kickoff:d.toLocaleString("en-GB",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
          const played=m.home_score!==""&&m.away_score!=="";
          return `<tr><td>${when}</td><td>${m.home_team}</td><td class="vs">${played?m.home_score+' – '+m.away_score:'vs'}</td><td>${m.away_team}</td></tr>`;
        }).join("")}</tbody>
      </table></div>`;

  document.getElementById("panel-rules").innerHTML=`
    <section class="block">
      <div class="head"><h2 class="disp">Fixtures</h2></div>
      ${fixturesHTML}
    </section>
    <section class="block">
      <div class="head"><h2 class="disp">Categories</h2></div>
      <div class="tablewrap"><table>
        <thead><tr><th>Category</th><th>Type</th><th>Points</th><th>Notes</th></tr></thead>
        <tbody>${categories.map(c=>
          `<tr><td>${c.label_en}</td><td><span class="tag ${c.type==='number'?'number':c.type==='fpl_squad'?'squad':''}">${TYPE_LABEL[c.type]||c.type}</span></td><td>${c.id==='kamper'?'3 exact · 1 result':c.points}</td><td>${c.notes}</td></tr>`
        ).join("")}</tbody>
      </table></div>
    </section>
    <section class="block">
      <div class="head"><h2 class="disp">Squad rules</h2></div>
      <div class="rec">
        <div class="cap">FPL score — one-time 11-player squad</div>
        <div class="who">1 GK · 3–5 DEF · 3–5 MID · 1–3 FWD</div>
        <div class="det">Max 3 players from any single club. Only players from clubs playing on Boxing Day are eligible. The category score is that squad's combined FPL points from the day's matches.</div>
      </div>
    </section>`;

  // ---------- tab: Overview ----------
  function renderOverview(){
    if(!submissions.length){
      return `<div class="rec"><div class="cap">Overview</div><div class="det">No forms submitted yet.</div></div>`;
    }
    const byPlayer={};
    submissions.forEach(r=>{(byPlayer[r.player_name]=byPlayer[r.player_name]||[]).push(r);});
    const names=Object.keys(byPlayer).sort();
    const find=(rows,catId,refId)=>rows.find(r=>r.category_id===catId&&(refId===undefined||r.ref_id===refId));
    const matchLabel=id=>{const m=matches.find(x=>x.match_id===id);return m?`${m.home_team} vs ${m.away_team}`:id;};
    const playerLabel=id=>{const p=players.find(x=>x.element_id===id);return p?`${p.name} (${p.team})`:id;};

    const mrows=matches.map(m=>{
      const cells=names.map(n=>{const r=find(byPlayer[n],"kamper",m.match_id);return `<td>${r?r.answer:'–'}</td>`;}).join("");
      return `<tr><td>${m.home_team} vs ${m.away_team}</td>${cells}</tr>`;
    }).join("");

    const otherCats=categories.filter(c=>c.id!=="kamper"&&c.id!=="fpl_score");
    const crows=otherCats.map(c=>{
      const cells=names.map(n=>{
        const r=find(byPlayer[n],c.id);
        if(!r)return "<td>–</td>";
        let v=r.answer;
        if(c.type==="match_pick")v=matchLabel(v);
        if(c.type==="player_pick")v=playerLabel(v);
        return `<td>${v}</td>`;
      }).join("");
      return `<tr><td>${c.label_en}</td>${cells}</tr>`;
    }).join("");

    const squadBlocks=names.map(n=>{
      const r=find(byPlayer[n],"fpl_score");
      const ids=r?r.answer.split(";").filter(Boolean):[];
      const squad=ids.map(id=>players.find(p=>p.element_id===id)).filter(Boolean);
      const byPos={GKP:[],DEF:[],MID:[],FWD:[]};
      squad.forEach(p=>{if(byPos[p.position])byPos[p.position].push(p);});
      const line=pos=>byPos[pos].map(p=>`${p.name} (${p.team})`).join(", ")||"–";
      return `<div class="rec"><div class="cap">${n}</div>
        <div class="det">GK: ${line("GKP")}<br>DEF: ${line("DEF")}<br>MID: ${line("MID")}<br>FWD: ${line("FWD")}</div></div>`;
    }).join("");

    return `
      <div class="subhead">Match predictions</div>
      <div class="tablewrap"><table>
        <thead><tr><th>Match</th>${names.map(n=>`<th>${n}</th>`).join("")}</tr></thead>
        <tbody>${mrows}</tbody>
      </table></div>

      <div class="subhead" style="margin-top:28px">Other bets</div>
      <div class="tablewrap"><table>
        <thead><tr><th>Category</th>${names.map(n=>`<th>${n}</th>`).join("")}</tr></thead>
        <tbody>${crows}</tbody>
      </table></div>

      <div class="subhead" style="margin-top:28px">Squads</div>
      ${squadBlocks}`;
  }
  document.getElementById("panel-overview").innerHTML=renderOverview();

  // ---------- tab: Leaderboard ----------
  function scoreMatch(pred,actual){
    if(pred===actual)return 3;
    const [ph,pa]=pred.split("-").map(Number),[ah,aa]=actual.split("-").map(Number);
    const predRes=ph>pa?"H":(ph===pa?"D":"A"),actRes=ah>aa?"H":(ah===aa?"D":"A");
    return predRes===actRes?1:0;
  }
  function renderLeaderboard(){
    if(!submissions.length){
      return `<div class="rec"><div class="cap">Leaderboard</div><div class="det">No forms submitted yet.</div></div>`;
    }
    if(!results.length){
      return `<div class="rec"><div class="cap">Leaderboard</div><div class="det">Results haven't been recorded yet — check back after Boxing Day.</div></div>`;
    }
    const byPlayer={};
    submissions.forEach(r=>{(byPlayer[r.player_name]=byPlayer[r.player_name]||[]).push(r);});
    const names=Object.keys(byPlayer).sort();
    const find=(rows,catId,refId)=>rows.find(r=>r.category_id===catId&&(refId===undefined||r.ref_id===refId));
    const resultRow=(catId,refId="")=>results.find(r=>r.category_id===catId&&r.ref_id===refId);

    const kamperLines=matches.map(m=>{
      const actual=resultRow("kamper",m.match_id);
      const scores={};
      names.forEach(n=>{
        const sub=find(byPlayer[n],"kamper",m.match_id);
        scores[n]=(sub&&actual&&actual.answer)?scoreMatch(sub.answer,actual.answer):null;
      });
      return{label:`${m.home_team} vs ${m.away_team}`,scores,known:!!(actual&&actual.answer)};
    });

    const otherCats=categories.filter(c=>c.id!=="kamper"&&c.id!=="fpl_score");
    const catLines=otherCats.map(c=>{
      const actual=resultRow(c.id);
      const pts=+c.points;
      const scores={};
      names.forEach(n=>{
        const sub=find(byPlayer[n],c.id);
        scores[n]=(sub&&actual&&actual.answer)?(sub.answer===actual.answer?pts:0):null;
      });
      return{label:c.label_en,scores,known:!!(actual&&actual.answer)};
    });

    const ptsById={};playerPoints.forEach(p=>{ptsById[p.element_id]=+p.points;});
    const fplTotals={};
    names.forEach(n=>{
      const sub=find(byPlayer[n],"fpl_score");
      const ids=sub?sub.answer.split(";").filter(Boolean):[];
      const allKnown=playerPoints.length>0&&ids.length===11&&ids.every(id=>ptsById[id]!==undefined);
      fplTotals[n]=allKnown?ids.reduce((s,id)=>s+ptsById[id],0):null;
    });
    const knownFpl=Object.values(fplTotals).filter(v=>v!==null);
    const maxFpl=knownFpl.length?Math.max(...knownFpl):null;
    const fplPts=+categories.find(c=>c.id==="fpl_score").points;
    const fplScores={};
    names.forEach(n=>{fplScores[n]=fplTotals[n]===null?null:(fplTotals[n]===maxFpl?fplPts:0);});
    const fplLine={label:"FPL score (own squad)",scores:fplScores,known:knownFpl.length>0};

    const allLines=[...kamperLines,...catLines,fplLine];
    const anyPending=allLines.some(l=>!l.known);

    const totals={};
    names.forEach(n=>{totals[n]=allLines.reduce((s,l)=>s+(l.scores[n]||0),0);});
    const ranked=[...names].sort((a,b)=>totals[b]-totals[a]);
    let rank=0,lastScore=null;
    const standingsRows=ranked.map((n,i)=>{
      if(totals[n]!==lastScore){rank=i+1;lastScore=totals[n];}
      return `<tr><td>${rank}</td><td>${n}</td><td><b>${totals[n]}</b></td></tr>`;
    }).join("");

    const breakdownRows=allLines.map(l=>{
      const cells=names.map(n=>`<td>${l.scores[n]===null?'–':l.scores[n]}</td>`).join("");
      return `<tr><td>${l.label}</td>${cells}</tr>`;
    }).join("");

    return `
      ${anyPending?`<div class="rec"><div class="det">Not every result has been recorded yet — standings below only count what's known so far and will keep updating.</div></div>`:""}
      <div class="subhead">Standings</div>
      <div class="tablewrap"><table>
        <thead><tr><th>#</th><th>Player</th><th>Points</th></tr></thead>
        <tbody>${standingsRows}</tbody>
      </table></div>

      <div class="subhead" style="margin-top:28px">Breakdown</div>
      <div class="det" style="color:var(--muted);margin-bottom:14px">"–" means that result hasn't been recorded yet.</div>
      <div class="tablewrap"><table>
        <thead><tr><th>Category</th>${names.map(n=>`<th>${n}</th>`).join("")}</tr></thead>
        <tbody>${breakdownRows}</tbody>
      </table></div>`;
  }
  document.getElementById("panel-leaderboard").innerHTML=renderLeaderboard();

  // ---------- tab: Edit form ----------
  function renderEdit(){
    if(!matches.length){
      return `<div class="rec"><div class="cap">Edit form</div><div class="det">Form will become available December 25th.</div></div>`;
    }
    const deadline=new Date(Date.UTC(+year,11,26,12,30));
    const closed=new Date()>deadline;
    const submitUrl=`https://github.com/${GH_REPO}/issues/new?template=boxing-day-submission.yml&labels=boxing-day-submission`;
    const editUrl=`https://github.com/${GH_REPO}/issues?q=${encodeURIComponent("is:issue label:boxing-day-submission author:@me")}`;

    let html=`<div class="rec"><div class="cap">Deadline</div><div class="det">Submissions close at 12:30 UK / 13:30 Norway time on Boxing Day (26th).${closed?' <b>That deadline has passed — submissions are now closed.</b>':''}</div></div>`;

    if(!closed){
      html+=`
        <div class="rec">
          <div class="cap">Haven't submitted yet?</div>
          <div class="det">Opens GitHub's "New issue" page, pre-filled with every match and bet for this year.</div>
          <a class="btn" href="${submitUrl}">Submit your sheet</a>
        </div>
        <div class="rec">
          <div class="cap">Already submitted?</div>
          <div class="det">Takes you straight to your own submission (you'll need to be logged into GitHub) — edit it there and it's automatically re-checked.</div>
          <a class="btn secondary" href="${editUrl}">Edit your submission</a>
        </div>`;
    }

    html+=`
      <div class="subhead" style="margin-top:28px">Eligible players</div>
      <div class="det" style="color:var(--muted);margin-bottom:14px">Use the exact "Full Name (CLUB)" spelling shown here when filling in the form.</div>
      <input type="text" id="playerFilter" placeholder="Filter by name or club…" style="margin-bottom:14px">
      <div class="tablewrap"><table id="playersTable"></table></div>`;
    return html;
  }
  document.getElementById("panel-edit").innerHTML=renderEdit();

  if(players.length){
    const renderPlayers=(filter="")=>{
      const f=filter.trim().toLowerCase();
      const rows=players.filter(p=>!f||p.name.toLowerCase().includes(f)||p.team.toLowerCase().includes(f));
      document.getElementById("playersTable").innerHTML=`
        <thead><tr><th>Name</th><th>Position</th><th>Club</th></tr></thead>
        <tbody>${rows.map(p=>`<tr><td>${p.name} (${p.team})</td><td>${p.position}</td><td>${p.team}</td></tr>`).join("")}</tbody>`;
    };
    renderPlayers();
    const filterInput=document.getElementById("playerFilter");
    if(filterInput)filterInput.oninput=e=>renderPlayers(e.target.value);
  }

  // ---------- tab switching ----------
  document.querySelectorAll("#tabBar .tab").forEach(btn=>{
    btn.onclick=()=>{
      document.querySelectorAll("#tabBar .tab").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      document.querySelectorAll(".panel").forEach(p=>p.style.display="none");
      document.getElementById(`panel-${btn.dataset.tab}`).style.display="";
    };
  });
})();
</script>
</body>
</html>
