name: Fetch Boxing Day fixtures + eligible players

on:
  schedule:
    - cron: "0 6 25 12 *"   # 06:00 UTC on Dec 25 every year - the day before Boxing Day
  workflow_dispatch:          # manual runs from the Actions tab, e.g. for testing
    inputs:
      year:
        description: "Override year (for testing only - leave blank to use the current year)"
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch fixtures + eligible players
        env:
          BOXING_DAY_YEAR: ${{ github.event.inputs.year }}
        run: python scripts/fetch_boxing_day.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/matches.csv data/eligible-players.csv; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/matches.csv data/eligible-players.csv
          git commit -m "Fetch Boxing Day fixtures + eligible players: $(date -u +%Y)"
          git push
